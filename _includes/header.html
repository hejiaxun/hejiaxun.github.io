<header class="site-header">
  <div class="site-shell header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
      <strong>贺加勋</strong><span>Jiaxun He</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a {% if page.permalink == '/' %}class="active"{% endif %} href="{{ '/' | relative_url }}">首页</a>
      <a {% if page.url contains '/research/' or page.category == 'research' %}class="active"{% endif %} href="{{ '/research/' | relative_url }}">学术研究</a>
      <a {% if page.url contains '/projects/' and page.category != 'research' %}class="active"{% endif %} href="{{ '/projects/' | relative_url }}">项目</a>
      <a {% if page.url contains '/competitions/' or page.category == 'competition' %}class="active"{% endif %} href="{{ '/competitions/' | relative_url }}">竞赛</a>
      <a {% if page.url contains '/experience/' %}class="active"{% endif %} href="{{ '/experience/' | relative_url }}">经历</a>
      <a {% if page.url contains '/cv/' %}class="active"{% endif %} href="{{ '/cv/' | relative_url }}">简历</a>
    </nav>
  </div>
</header>
