<article class="project-card">
  <a class="project-card-link" href="{{ project.url | relative_url }}">
    {% if project.img %}
      <img class="project-card-image" src="{{ project.img | relative_url }}" alt="{{ project.title }} 项目预览图" loading="lazy">
    {% endif %}
    <div class="project-card-body">
      <p class="project-card-label">{% if project.category == 'research' %}学术研究{% elsif project.category == 'embodied-ai' %}具身智能{% else %}机器人系统{% endif %}</p>
      <h3>{{ project.title }}</h3>
      <p>{{ project.description }}</p>
      <span class="project-card-more">查看详情 →</span>
    </div>
  </a>
</article>
