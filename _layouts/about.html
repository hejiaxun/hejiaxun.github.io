layout: default
---
<aside class="home-sidebar" aria-label="个人信息">
  <div class="sidebar-inner">
    <img class="sidebar-photo" src="{{ '/assets/img/prof_pic.png' | relative_url }}" alt="贺加勋证件照">
    <h1 class="sidebar-name">贺加勋</h1>
    <div class="sidebar-tags" aria-label="身份">
      <span>硕士研究生</span>
      <span>机器人研究与工程</span>
      <span>上海交通大学</span>
    </div>

    <div class="sidebar-link-title"><span>链接</span></div>
    <div class="sidebar-links">
      <span class="sidebar-link-disabled" title="邮箱地址暂未公开" aria-label="邮箱地址暂未公开">
        <span class="mail-mark" aria-hidden="true">✉</span><span>邮箱</span>
      </span>
      <a href="https://github.com/{{ site.github_username }}" aria-label="GitHub">
        <span class="github-mark" aria-hidden="true">GH</span><span>GitHub</span>
      </a>
    </div>
  </div>
</aside>

<div class="home-main-column">
  <div class="home-shell">
    <section class="home-identity">
      <p class="eyebrow">ROBOTICS · EMBODIED INTELLIGENCE · ROBOT SYSTEMS</p>
      <h1>贺加勋 <span>Jiaxun He</span></h1>
      <p class="home-role">上海交通大学机械与动力工程学院 · 硕士研究生</p>
      <p class="home-address">机器人状态估计、规划与控制、具身智能与真实机器人系统</p>
      <p class="home-summary">我关注如何将物理建模、学习方法、仿真验证、传感与嵌入式系统连接起来，并在真实机器人上形成可验证的闭环。</p>
      <p class="home-contact"><a href="https://github.com/{{ site.github_username }}">github.com/{{ site.github_username }}</a></p>
    </section>

    <article class="home-content prose">
      {{ content }}
    </article>
  </div>
</div>
