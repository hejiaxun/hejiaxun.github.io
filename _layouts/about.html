---
layout: default
---
<aside class="home-sidebar" aria-label="个人信息">
  <div class="sidebar-inner">
    <img class="sidebar-photo" src="{{ '/assets/img/prof_pic.png' | relative_url }}" alt="贺加勋证件照">
    <h1 class="sidebar-name">贺加勋</h1>
    <div class="sidebar-tags" aria-label="身份">
      <span>控制科学与工程硕士</span>
      <span>具身智能实习生</span>
      <span>上海交通大学</span>
    </div>

    <div class="sidebar-link-title"><span>链接</span></div>
    <div class="sidebar-links">
      <a href="mailto:{{ site.email }}" title="{{ site.email }}" aria-label="发送邮件至 {{ site.email }}">
        <span class="mail-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3.75 6.75h16.5v10.5H3.75zM4.5 7.5l7.5 5.25 7.5-5.25"/></svg>
        </span>
      </a>
      <a href="https://github.com/{{ site.github_username }}" aria-label="GitHub">
        <span class="github-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.77-.24.77-.54v-2.18c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.68.08-.68 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.5-.28-5.13-1.25-5.13-5.54 0-1.22.44-2.22 1.16-3-.12-.28-.5-1.42.11-2.96 0 0 .95-.3 3.08 1.15A10.7 10.7 0 0 1 12 5.81c.95 0 1.9.13 2.79.38 2.14-1.45 3.08-1.15 3.08-1.15.61 1.54.23 2.68.11 2.96.72.78 1.16 1.78 1.16 3 0 4.3-2.64 5.25-5.15 5.53.4.35.76 1.03.76 2.08v3.48c0 .3.2.65.78.54A11.2 11.2 0 0 0 12 .8z"/></svg>
        </span>
      </a>
    </div>
  </div>
</aside>

<div class="home-main-column">
  <div class="home-shell">
    <section class="home-identity">
      <h1>贺加勋 <span>Jiaxun He</span></h1>
      <p class="home-role">上海交通大学自动化与感知学院 · 控制科学与工程硕士研究生</p>
      <p class="home-address">机器人状态估计、规划与控制、具身智能与真实机器人系统</p>
      <p class="home-summary">我关注如何将物理建模、学习方法、仿真验证、传感与嵌入式系统连接起来，并在真实机器人上形成可验证的闭环。</p>
      <p class="home-contact">
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/{{ site.github_username }}">github.com/{{ site.github_username }}</a>
      </p>
    </section>

    <article class="home-content prose">
      {{ content }}
    </article>
  </div>
</div>
