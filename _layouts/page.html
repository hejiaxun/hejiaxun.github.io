---
layout: default
---
<div class="site-shell page-shell">
  <header class="page-header">
    {% if page.kicker %}<p class="eyebrow">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-description">{{ page.description }}</p>{% endif %}
  </header>
  <article class="prose">
    {{ content }}
  </article>
</div>
