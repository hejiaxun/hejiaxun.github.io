<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">旋转导向钻井地面—井下信息链路</title>
  <desc id="desc">轨迹趋势预测、地面指令、泥浆脉冲下传、井下执行和状态测量构成的信息链路示意。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#315f87"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#9b2f3d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#182536" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="#f6f8fb"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">
    <text x="58" y="64" fill="#1f2a3a" font-size="31" font-weight="760">地面—井下信息链路</text>
    <text x="58" y="96" fill="#647184" font-size="17">轨迹趋势预测 × 泥浆脉冲下传解码</text>

    <line x1="52" y1="274" x2="908" y2="274" stroke="#b7c0cc" stroke-width="2" stroke-dasharray="8 9"/>
    <rect x="61" y="250" width="66" height="48" rx="24" fill="#eef2f6"/>
    <text x="78" y="280" fill="#667386" font-size="16" font-weight="700">地面</text>
    <rect x="833" y="250" width="66" height="48" rx="24" fill="#f3e8ea"/>
    <text x="850" y="280" fill="#92333f" font-size="16" font-weight="700">井下</text>

    <g filter="url(#shadow)">
      <rect x="80" y="132" width="254" height="96" rx="14" fill="#ffffff" stroke="#cfd7e2" stroke-width="2"/>
      <text x="108" y="169" fill="#1f2a3a" font-size="20" font-weight="760">轨迹趋势预测</text>
      <text x="108" y="200" fill="#687689" font-size="15">井斜 · 方位 · 下一 10 m 轨迹</text>

      <rect x="520" y="132" width="240" height="96" rx="14" fill="#ffffff" stroke="#cfd7e2" stroke-width="2"/>
      <text x="548" y="169" fill="#1f2a3a" font-size="20" font-weight="760">地面指令</text>
      <text x="548" y="200" fill="#687689" font-size="15">人工决策与控制参数下发</text>

      <rect x="520" y="330" width="240" height="100" rx="14" fill="#fff7f7" stroke="#d8aeb4" stroke-width="2"/>
      <text x="548" y="369" fill="#7f2834" font-size="20" font-weight="760">井下执行</text>
      <text x="548" y="401" fill="#7d5960" font-size="15">传感器 · 控制器 · 执行机构</text>

      <rect x="80" y="330" width="254" height="100" rx="14" fill="#ffffff" stroke="#cfd7e2" stroke-width="2"/>
      <text x="108" y="369" fill="#1f2a3a" font-size="20" font-weight="760">井下测量</text>
      <text x="108" y="401" fill="#687689" font-size="15">近钻头传感与随钻历史数据</text>
    </g>

    <path d="M334 180H498" fill="none" stroke="#315f87" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <text x="383" y="163" fill="#315f87" font-size="13" font-weight="700">决策辅助</text>

    <path d="M640 228V310" fill="none" stroke="#9b2f3d" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-red)"/>
    <rect x="660" y="251" width="154" height="34" rx="17" fill="#f4e5e7"/>
    <text x="679" y="273" fill="#8f2f3b" font-size="14" font-weight="720">泥浆脉冲下传</text>

    <path d="M520 380H356" fill="none" stroke="#315f87" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <text x="397" y="363" fill="#315f87" font-size="13" font-weight="700">状态反馈</text>

    <path d="M205 330V249C205 236 215 226 228 226H250" fill="none" stroke="#315f87" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <text x="102" y="300" fill="#315f87" font-size="13" font-weight="700">多井数据建模</text>

    <rect x="58" y="469" width="844" height="42" rx="10" fill="#eef2f6"/>
    <text x="82" y="496" fill="#526174" font-size="15">两项工作分别覆盖地面侧趋势判断与井下指令恢复；当前按系统关系展示，不代表已完成现场在线闭环集成。</text>
  </g>
</svg>
