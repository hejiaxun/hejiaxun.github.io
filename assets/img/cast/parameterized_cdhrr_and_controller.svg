<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">参数化绳驱机器人建模与控制接口</title>
  <desc id="desc">从参数化机器人描述生成 MuJoCo 模型，再输出供规划调用的绳长控制接口。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2f7d82"/>
    </marker>
    <style>
      .bg{fill:#f8faf9}.card{fill:#fff;stroke:#d4dcda;stroke-width:2}.step{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;letter-spacing:.08em;fill:#2f7d82}.head{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#18313e}.body{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#5e7078}.line{fill:none;stroke:#2f7d82;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}.foot{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#405760}.pill{fill:#e6f1f1}.pilltext{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#2f7d82}
    </style>
  </defs>
  <rect class="bg" width="1200" height="390" rx="20"/>

  <rect class="card" x="55" y="55" width="310" height="225" rx="18"/>
  <text class="step" x="88" y="96">01 · ROBOT DESCRIPTION</text>
  <text class="head" x="88" y="143">参数化机器人描述</text>
  <text class="body" x="88" y="188">节数 · 单节尺寸 · 绳路布局</text>
  <text class="body" x="88" y="225">统一生成结构与接口</text>

  <path class="line" d="M383 168H445"/>

  <rect class="card" x="463" y="55" width="310" height="225" rx="18"/>
  <text class="step" x="496" y="96">02 · PHYSICS MODEL</text>
  <text class="head" x="496" y="143">MuJoCo 机器人模型</text>
  <text class="body" x="496" y="188">2N 自由度 · 3N 空间绳</text>
  <text class="body" x="496" y="225">执行器、传感器与接触动力学</text>

  <path class="line" d="M791 168H853"/>

  <rect class="card" x="871" y="55" width="274" height="225" rx="18"/>
  <text class="step" x="904" y="96">03 · CONTROL API</text>
  <text class="head" x="904" y="143">绳长控制接口</text>
  <text class="body" x="904" y="188">关节参考 → 3N 路绳长命令</text>
  <text class="body" x="904" y="225">供上层规划统一调用</text>

  <rect class="pill" x="55" y="315" width="126" height="38" rx="19"/>
  <text class="pilltext" x="118" y="340" text-anchor="middle">主评测配置</text>
  <text class="foot" x="205" y="341">12 节 · 24 自由度 · 36 绳 · 固定基座</text>
</svg>
