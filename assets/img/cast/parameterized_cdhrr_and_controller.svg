<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">参数化绳驱机械臂建模与控制</title>
  <desc id="desc">从参数化机器人描述，经 MuJoCo 物理模型，生成满足绳驱约束的控制命令。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4777b8"/>
    </marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172235}
      .label{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1d2939}
      .sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .note{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#315f9e}
    </style>
  </defs>

  <text class="title" x="70" y="48">参数化绳驱机械臂建模与控制</text>

  <rect x="70" y="82" width="280" height="130" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
  <text class="label" x="105" y="128">参数化描述</text>
  <text class="sub" x="105" y="164">节数、尺寸与绳路</text>
  <text class="sub" x="105" y="190">统一生成机器人资产</text>

  <line x1="350" y1="147" x2="455" y2="147" stroke="#4777b8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="470" y="82" width="280" height="130" rx="18" fill="#f3f7fc" stroke="#90acd2" stroke-width="2"/>
  <text class="label" x="505" y="128">MuJoCo 物理模型</text>
  <text class="sub" x="505" y="164">关节、绳索与传感</text>
  <text class="sub" x="505" y="190">接触、摩擦与动力学</text>

  <line x1="750" y1="147" x2="855" y2="147" stroke="#4777b8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="870" y="82" width="260" height="130" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
  <text class="label" x="905" y="128">绳长控制</text>
  <text class="sub" x="905" y="164">关节参考映射为绳长</text>
  <text class="sub" x="905" y="190">预张力与速率约束</text>

  <line x1="70" y1="248" x2="1130" y2="248" stroke="#e3e8ef" stroke-width="2"/>
  <text class="note" x="70" y="278">主要评测构型：12 节 · 24 自由度 · 36 绳 · 固定基座</text>
</svg>
