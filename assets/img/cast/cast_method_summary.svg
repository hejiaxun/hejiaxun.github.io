<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">CAST 规划方法</title>
  <desc id="desc">先通过控制器在环搜索生成成功回合，再训练动作块扩散策略，最后在在线规划中筛选候选并滚动执行。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4777b8"/>
    </marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172235}
      .phase{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#4777b8;letter-spacing:1px}
      .label{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1d2939}
      .sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
    </style>
  </defs>

  <text class="title" x="70" y="48">控制器在环的扩散式全臂规划</text>

  <text class="phase" x="90" y="83">数据生成</text>
  <rect x="70" y="98" width="280" height="130" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
  <text class="label" x="105" y="145">闭环成功搜索</text>
  <text class="sub" x="105" y="181">在控制器中验证候选轨迹</text>
  <text class="sub" x="105" y="207">保留可执行的成功回合</text>

  <line x1="350" y1="163" x2="455" y2="163" stroke="#4777b8" stroke-width="4" marker-end="url(#arrow)"/>

  <text class="phase" x="490" y="83">策略学习</text>
  <rect x="470" y="98" width="280" height="130" rx="18" fill="#f3f7fc" stroke="#90acd2" stroke-width="2"/>
  <text class="label" x="505" y="145">动作块扩散策略</text>
  <text class="sub" x="505" y="181">由当前状态生成多步动作</text>
  <text class="sub" x="505" y="207">学习成功回合中的规避模式</text>

  <line x1="750" y1="163" x2="855" y2="163" stroke="#4777b8" stroke-width="4" marker-end="url(#arrow)"/>

  <text class="phase" x="890" y="83">在线规划</text>
  <rect x="870" y="98" width="260" height="130" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
  <text class="label" x="905" y="145">筛选与滚动执行</text>
  <text class="sub" x="905" y="181">全臂约束检查候选动作</text>
  <text class="sub" x="905" y="207">执行首步并重新规划</text>
</svg>
