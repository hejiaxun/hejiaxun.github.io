<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">ROBOCON 机器人电控链路</title>
  <desc id="desc">传感采集经 STM32F405 主控与通信接口连接执行器，最终完成四台机器人整机联调。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9b2e42"/>
    </marker>
    <style>
      .bg{fill:#faf9f9}.card{fill:#fff;stroke:#ded7d9;stroke-width:2}.step{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;letter-spacing:.08em;fill:#9b2e42}.head{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#202a39}.body{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#667080}.line{fill:none;stroke:#9b2e42;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}.foot{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#4f5968}.pill{fill:#f5e9ec}.pilltext{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#9b2e42}
    </style>
  </defs>
  <rect class="bg" width="1200" height="380" rx="20"/>

  <rect class="card" x="55" y="50" width="310" height="220" rx="18"/>
  <text class="step" x="88" y="92">01 · SENSING</text>
  <text class="head" x="88" y="139">传感采集</text>
  <text class="body" x="88" y="184">激光测距 · 光纤陀螺</text>
  <text class="body" x="88" y="221">编码器与模拟量采集</text>

  <path class="line" d="M383 161H445"/>

  <rect class="card" x="463" y="50" width="310" height="220" rx="18"/>
  <text class="step" x="496" y="92">02 · CONTROLLER</text>
  <text class="head" x="496" y="139">STM32F405 主控</text>
  <text class="body" x="496" y="184">ADC · CAN / UART / 以太网</text>
  <text class="body" x="496" y="221">状态采集与控制指令</text>

  <path class="line" d="M791 161H853"/>

  <rect class="card" x="871" y="50" width="274" height="220" rx="18"/>
  <text class="step" x="904" y="92">03 · ROBOT SYSTEM</text>
  <text class="head" x="904" y="139">执行器与整机</text>
  <text class="body" x="904" y="184">电机与驱动 · 供电与线束</text>
  <text class="body" x="904" y="221">四台机器人联调与赛场保障</text>

  <rect class="pill" x="55" y="306" width="126" height="38" rx="19"/>
  <text class="pilltext" x="118" y="331" text-anchor="middle">个人负责范围</text>
  <text class="foot" x="205" y="332">板卡设计与制作 · 电控集成 · 整机调试与维护</text>
</svg>
