<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">DexUMI Co-design 设计评价回路</title>
  <desc id="desc">参数化装置设计经过穿戴仿真与控制、人体与任务评价后进行方案比较，并反馈更新装置设计。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4777b8"/>
    </marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172235}
      .label{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1d2939}
      .sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#667085}
      .feedback{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#4777b8}
    </style>
  </defs>

  <text class="title" x="70" y="48">DexUMI Co-design：无本体数采装置设计评价回路</text>

  <rect x="60" y="82" width="240" height="118" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
  <text class="label" x="90" y="128">参数化装置设计</text>
  <text class="sub" x="90" y="164">CAD 特征与装配参数</text>

  <line x1="300" y1="141" x2="345" y2="141" stroke="#4777b8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="360" y="82" width="260" height="118" rx="18" fill="#f3f7fc" stroke="#90acd2" stroke-width="2"/>
  <text class="label" x="390" y="128">穿戴仿真与控制</text>
  <text class="sub" x="390" y="164">MANO · UMI 优化 · DexUMI PPO</text>

  <line x1="620" y1="141" x2="665" y2="141" stroke="#4777b8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="680" y="82" width="240" height="118" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
  <text class="label" x="710" y="128">人体与任务评价</text>
  <text class="sub" x="710" y="164">接触 · 负荷 · 疲劳 · 可行性</text>

  <line x1="920" y1="141" x2="965" y2="141" stroke="#4777b8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="980" y="82" width="160" height="118" rx="18" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
  <text class="label" x="1010" y="128">方案比较</text>
  <text class="sub" x="1010" y="164">选择下一组设计</text>

  <path d="M1060 200 V247 H180 V215" fill="none" stroke="#4777b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="feedback" x="505" y="277">评价结果更新接口设计</text>
</svg>
