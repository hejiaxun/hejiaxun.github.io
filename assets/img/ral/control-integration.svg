<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">PG-CHTC 在既有张力—构型混合控制闭环中的接入位置</title>
  <desc id="desc">参考目标进入既有混合控制器，控制器驱动绳驱机器人。实机测得关节角和驱动侧张力，PG-CHTC 将其转换为全臂关节侧张力反馈。</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .subtitle{font:400 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .node-title{font:650 25px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .node-text{font:400 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .blue-title{font:700 25px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1d4ed8}
      .signal{font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#475569}
      .signal-blue{font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1d4ed8}
      .line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow-dark)}
      .blue-line{fill:none;stroke:#2563eb;stroke-width:3.5;marker-end:url(#arrow-blue)}
    </style>
  </defs>

  <rect width="1440" height="600" rx="28" fill="#ffffff"/>
  <rect x="24" y="24" width="1392" height="552" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text class="title" x="62" y="80">PG-CHTC 只替换内部张力状态的获取方式</text>
  <text class="subtitle" x="62" y="114">既有控制器、驱动与安全逻辑保持不变；蓝色链路为本文新增部分。</text>

  <rect x="62" y="180" width="230" height="156" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
  <text class="node-title" x="96" y="229">控制目标</text>
  <text class="signal" x="96" y="274">θ_ref(t)</text>
  <text class="signal" x="96" y="309">T_ref(t)</text>

  <rect x="420" y="144" width="438" height="226" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <text class="node-title" x="466" y="197">既有张力—构型混合控制器</text>
  <line x1="466" y1="219" x2="812" y2="219" stroke="#e2e8f0" stroke-width="2"/>
  <text class="node-text" x="466" y="263">构型支路：关节角误差 → 绳长校正</text>
  <text class="node-text" x="466" y="302">张力支路：张力误差 → 收紧/放松校正</text>
  <text class="node-text" x="466" y="341">补偿与约束：摩擦、变形、张力边界</text>

  <rect x="1052" y="180" width="324" height="156" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
  <text class="node-title" x="1092" y="229">绳驱机器人</text>
  <text class="node-text" x="1092" y="272">驱动绳执行控制命令</text>
  <text class="node-text" x="1092" y="307">输出角度与驱动侧张力</text>

  <rect x="1052" y="436" width="324" height="104" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
  <text class="node-title" x="1092" y="478">实机可测状态</text>
  <text class="signal" x="1092" y="514">θ(t), T_act(t)</text>

  <rect x="420" y="430" width="438" height="116" rx="20" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/>
  <text class="blue-title" x="464" y="478">PG-CHTC 虚拟张力传感器</text>
  <text class="node-text" x="464" y="518">θ(t), T_act(t) → 全臂关节侧张力 T̂_joint(t)</text>

  <path class="line" d="M292 258 H414"/>

  <path class="line" d="M858 258 H1046"/>
  <text class="signal" x="906" y="244">驱动命令</text>

  <path class="line" d="M1214 336 V430"/>
  <text class="signal" x="1230" y="391">θ, T_act</text>

  <path class="blue-line" d="M1052 488 H864"/>
  <text class="signal-blue" x="900" y="474">θ, T_act</text>

  <path class="blue-line" d="M639 430 V376"/>
  <text class="signal-blue" x="657" y="409">T̂_joint</text>

  <path class="line" d="M1052 454 H930 V392 H800 V376"/>
  <text class="signal" x="936" y="380">θ</text>
</svg>
